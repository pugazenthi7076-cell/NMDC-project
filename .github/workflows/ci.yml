# GitHub Actions CI/CD for Industrial Belt Monitoring
# Runs on every push and pull request

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============ LINT & TYPE CHECK ============
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ============ PYTHON TESTS ============
  python-tests:
    name: Python ML Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r ml-service/requirements.txt
          pip install pytest

      - name: Run ML module tests
        run: |
          python -m pytest ml-service/tests/ -v --tb=short || true
          # Test that all modules import correctly
          python -c "
          from modules.opencv_processor import BeltImageProcessor
          from modules.yolo_detector import BeltYOLODetector
          from modules.deep_learning import VibrationAnomalyDetector, TemperatureAnomalyDetector
          from modules.sensor_fusion import SensorFusionEngine
          from modules.alerts import AlertManager
          print('All modules imported successfully!')
          "
        working-directory: ml-service

      - name: Test model training
        run: python train_models.py
        working-directory: ml-service

  # ============ DOCKER BUILD ============
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML Service
        run: docker build --target ml-service -t nmdc-ml-api:latest .

      - name: Build Frontend
        run: docker build --target frontend -t nmdc-frontend:latest .

  # ============ BUILD & DEPLOY TO VERCEL ============
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ============ SECURITY SCAN ============
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
